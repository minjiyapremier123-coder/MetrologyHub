name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install backend dependencies
      working-directory: ./backend
      run: |
        npm ci

    - name: Run backend tests
      working-directory: ./backend
      run: |
        npm test

    - name: Build docker images
      run: |
        docker build -t lm-poc-backend ./backend
        docker build -t lm-poc-frontend ./frontend

    - name: Run integration tests in container
      run: |
        # Start postgres service first
        docker compose up -d --build postgres
        echo 'Waiting for Postgres to initialize...'
        sleep 10
        # Run migrations
        docker compose run --rm backend npm run migrate
        # Start backend in TEST_MODE so e2e can inject text
        docker compose up -d --build --scale backend=1
        # Wait for backend to be ready
        for i in {1..60}; do
          if curl -sSf http://localhost:5001/health >/dev/null 2>&1; then echo 'backend ready' && break; fi
          echo 'waiting for backend...' ; sleep 2;
        done
        # Run unit tests (inside container)
        docker compose run --rm backend npm test
        # Run integration test (real OCR) - may require tesseract data download
        docker compose run --rm -e TEST_MODE=1 -e API_URL=http://backend:5001 backend npm run test:e2e
        # Also run original integration (downloads a sample image and posts it)
        docker compose run --rm -e API_URL=http://backend:5001 backend npm run test:integration
        # Tear down
        docker compose down
